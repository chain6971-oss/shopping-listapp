<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      height: fit-content;
    }

    h1 {
      font-size: 1.6rem;
      color: #1a202c;
      margin-bottom: 24px;
      text-align: center;
    }

    /* [접근성] label은 시각적으로 숨기되 스크린리더에는 노출 */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #4f8ef7;
    }

    .input-row button {
      padding: 12px 20px;
      background: #4f8ef7;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: #3a78e0;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .clear-done {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0;
    }

    .clear-done:hover {
      text-decoration: underline;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-radius: 10px;
      transition: background 0.15s;
      cursor: pointer;
    }

    li:hover {
      background: #f7fafc;
    }

    li.done .item-text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e0;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    li.done .checkbox {
      background: #48bb78;
      border-color: #48bb78;
    }

    .checkbox svg {
      display: none;
    }

    li.done .checkbox svg {
      display: block;
    }

    .item-text {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      word-break: break-word;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #cbd5e0;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #e53e3e;
    }

    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 40px 0;
      font-size: 0.95rem;
    }

    .storage-error {
      font-size: 0.8rem;
      color: #e53e3e;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 쇼핑 리스트</h1>

    <!-- [접근성] <form> 으로 감싸 시맨틱 구조 확보, submit 이벤트 활용 -->
    <form id="addForm" novalidate>
      <!-- [접근성] visually-hidden label로 스크린리더 지원 -->
      <label for="itemInput" class="visually-hidden">아이템 이름</label>
      <div class="input-row">
        <input
          type="text"
          id="itemInput"
          placeholder="아이템을 입력하세요..."
          maxlength="100"
          autocomplete="off"
        >
        <!-- [접근성] type="submit" 으로 명시 -->
        <button type="submit">추가</button>
      </div>
    </form>

    <div class="stats">
      <span id="statsText">총 0개</span>
      <!-- [접근성] type="button" 명시로 form submit 방지 -->
      <button type="button" class="clear-done" id="clearDoneBtn">완료 항목 삭제</button>
    </div>

    <ul id="list" aria-label="쇼핑 목록"></ul>
    <div class="empty" id="empty">아직 아이템이 없어요.</div>
    <p class="storage-error" id="storageError">저장 공간이 부족합니다.</p>
  </div>

  <script>
    /* [에러 처리] localStorage 접근을 try/catch 로 래핑 (QuotaExceededError 대응) */
    function loadFromStorage() {
      try {
        return JSON.parse(localStorage.getItem('shoppingList') || '[]');
      } catch {
        return [];
      }
    }

    function saveToStorage(data) {
      try {
        localStorage.setItem('shoppingList', JSON.stringify(data));
        document.getElementById('storageError').style.display = 'none';
      } catch (e) {
        if (e.name === 'QuotaExceededError') {
          document.getElementById('storageError').style.display = 'block';
        }
      }
    }

    let items = loadFromStorage();

    function render() {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const stats = document.getElementById('statsText');

      const done = items.filter(i => i.checked).length;
      stats.textContent = `총 ${items.length}개 · 완료 ${done}개`;
      empty.style.display = items.length === 0 ? 'block' : 'none';

      /* [보안] innerHTML 대신 createElement + textContent 사용 (XSS 방지) */
      list.innerHTML = '';
      items.forEach((item, idx) => {
        const li = document.createElement('li');
        if (item.checked) li.classList.add('done');

        const checkbox = document.createElement('div');
        checkbox.className = 'checkbox';
        checkbox.setAttribute('aria-hidden', 'true');
        const checkSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        checkSvg.setAttribute('width', '12');
        checkSvg.setAttribute('height', '10');
        checkSvg.setAttribute('viewBox', '0 0 12 10');
        checkSvg.setAttribute('fill', 'none');
        const checkPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        checkPath.setAttribute('d', 'M1 5l3.5 3.5L11 1');
        checkPath.setAttribute('stroke', 'white');
        checkPath.setAttribute('stroke-width', '2');
        checkPath.setAttribute('stroke-linecap', 'round');
        checkPath.setAttribute('stroke-linejoin', 'round');
        checkSvg.appendChild(checkPath);
        checkbox.appendChild(checkSvg);

        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = item.text; /* [보안] textContent로 안전하게 삽입 */

        /* [접근성] 아이콘 전용 버튼에 aria-label 추가 */
        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.setAttribute('aria-label', `${item.text} 삭제`);
        const deleteSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        deleteSvg.setAttribute('width', '16');
        deleteSvg.setAttribute('height', '16');
        deleteSvg.setAttribute('viewBox', '0 0 16 16');
        deleteSvg.setAttribute('fill', 'none');
        deleteSvg.setAttribute('aria-hidden', 'true');
        const deletePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        deletePath.setAttribute('d', 'M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9h8l1-9');
        deletePath.setAttribute('stroke', 'currentColor');
        deletePath.setAttribute('stroke-width', '1.5');
        deletePath.setAttribute('stroke-linecap', 'round');
        deletePath.setAttribute('stroke-linejoin', 'round');
        deleteSvg.appendChild(deletePath);
        deleteBtn.appendChild(deleteSvg);

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);

        /* [이벤트] addEventListener 사용 (인라인 onclick 제거) */
        checkbox.addEventListener('click', (e) => { e.stopPropagation(); toggleItem(idx); });
        span.addEventListener('click', () => toggleItem(idx));
        deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteItem(idx); });

        list.appendChild(li);
      });
    }

    function addItem() {
      const input = document.getElementById('itemInput');
      const text = input.value.trim();
      if (!text) return;
      items.push({ text, checked: false });
      input.value = '';
      saveToStorage(items);
      render();
      input.focus();
    }

    function toggleItem(idx) {
      items[idx].checked = !items[idx].checked;
      saveToStorage(items);
      render();
    }

    function deleteItem(idx) {
      items.splice(idx, 1);
      saveToStorage(items);
      render();
    }

    /* [이벤트] addEventListener 로 폼 submit 처리 */
    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      addItem();
    });

    document.getElementById('clearDoneBtn').addEventListener('click', () => {
      items = items.filter(i => !i.checked);
      saveToStorage(items);
      render();
    });

    render();
  </script>
</body>
</html>
