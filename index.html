<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      height: fit-content;
    }

    h1 {
      font-size: 1.6rem;
      color: #1a202c;
      margin-bottom: 24px;
      text-align: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #4f8ef7;
    }

    .input-row button {
      padding: 12px 20px;
      background: #4f8ef7;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: #3a78e0;
    }

    .input-row button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .clear-done {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0;
    }

    .clear-done:hover {
      text-decoration: underline;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-radius: 10px;
      transition: background 0.15s;
      cursor: pointer;
    }

    li:hover {
      background: #f7fafc;
    }

    li.done .item-text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e0;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    li.done .checkbox {
      background: #48bb78;
      border-color: #48bb78;
    }

    .checkbox svg {
      display: none;
    }

    li.done .checkbox svg {
      display: block;
    }

    .item-text {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      word-break: break-word;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #cbd5e0;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #e53e3e;
    }

    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 40px 0;
      font-size: 0.95rem;
    }

    .loading {
      text-align: center;
      color: #a0aec0;
      padding: 40px 0;
      font-size: 0.95rem;
    }

    .db-error {
      font-size: 0.8rem;
      color: #e53e3e;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 쇼핑 리스트</h1>

    <form id="addForm" novalidate>
      <label for="itemInput" class="visually-hidden">아이템 이름</label>
      <div class="input-row">
        <input
          type="text"
          id="itemInput"
          placeholder="아이템을 입력하세요..."
          maxlength="100"
          autocomplete="off"
        >
        <button type="submit" id="addBtn">추가</button>
      </div>
    </form>

    <div class="stats">
      <span id="statsText">총 0개</span>
      <button type="button" class="clear-done" id="clearDoneBtn">완료 항목 삭제</button>
    </div>

    <ul id="list" aria-label="쇼핑 목록"></ul>
    <div class="loading" id="loading">불러오는 중...</div>
    <div class="empty" id="empty" style="display:none">아직 아이템이 없어요.</div>
    <p class="db-error" id="dbError"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://vsnuwikgxrovegtrthrv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzbnV3aWtneHJvdmVndHJ0aHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NjQ0NDIsImV4cCI6MjA5NjU0MDQ0Mn0.SWb7a7wSWqJu_1rau8SqgYdVq1pRtcc46AmWLTVXnGw';

    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let items = [];

    function showError(msg) {
      const el = document.getElementById('dbError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function clearError() {
      document.getElementById('dbError').style.display = 'none';
    }

    function setLoading(on) {
      document.getElementById('loading').style.display = on ? 'block' : 'none';
    }

    function setAddDisabled(on) {
      document.getElementById('addBtn').disabled = on;
      document.getElementById('itemInput').disabled = on;
    }

    function render() {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const stats = document.getElementById('statsText');

      const done = items.filter(i => i.checked).length;
      stats.textContent = `총 ${items.length}개 · 완료 ${done}개`;
      empty.style.display = items.length === 0 ? 'block' : 'none';

      list.innerHTML = '';
      items.forEach((item, idx) => {
        const li = document.createElement('li');
        if (item.checked) li.classList.add('done');

        const checkbox = document.createElement('div');
        checkbox.className = 'checkbox';
        checkbox.setAttribute('aria-hidden', 'true');
        const checkSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        checkSvg.setAttribute('width', '12');
        checkSvg.setAttribute('height', '10');
        checkSvg.setAttribute('viewBox', '0 0 12 10');
        checkSvg.setAttribute('fill', 'none');
        const checkPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        checkPath.setAttribute('d', 'M1 5l3.5 3.5L11 1');
        checkPath.setAttribute('stroke', 'white');
        checkPath.setAttribute('stroke-width', '2');
        checkPath.setAttribute('stroke-linecap', 'round');
        checkPath.setAttribute('stroke-linejoin', 'round');
        checkSvg.appendChild(checkPath);
        checkbox.appendChild(checkSvg);

        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = item.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.setAttribute('aria-label', `${item.text} 삭제`);
        const deleteSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        deleteSvg.setAttribute('width', '16');
        deleteSvg.setAttribute('height', '16');
        deleteSvg.setAttribute('viewBox', '0 0 16 16');
        deleteSvg.setAttribute('fill', 'none');
        deleteSvg.setAttribute('aria-hidden', 'true');
        const deletePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        deletePath.setAttribute('d', 'M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9h8l1-9');
        deletePath.setAttribute('stroke', 'currentColor');
        deletePath.setAttribute('stroke-width', '1.5');
        deletePath.setAttribute('stroke-linecap', 'round');
        deletePath.setAttribute('stroke-linejoin', 'round');
        deleteSvg.appendChild(deletePath);
        deleteBtn.appendChild(deleteSvg);

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);

        checkbox.addEventListener('click', (e) => { e.stopPropagation(); toggleItem(idx); });
        span.addEventListener('click', () => toggleItem(idx));
        deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteItem(idx); });

        list.appendChild(li);
      });
    }

    async function loadItems() {
      setLoading(true);
      const { data, error } = await db
        .from('shopping_items')
        .select('*')
        .order('created_at', { ascending: true });

      setLoading(false);
      if (error) { showError('데이터를 불러오지 못했습니다: ' + error.message); return; }
      items = data;
      render();
    }

    async function addItem() {
      const input = document.getElementById('itemInput');
      const text = input.value.trim();
      if (!text) return;

      setAddDisabled(true);
      clearError();
      const { data, error } = await db
        .from('shopping_items')
        .insert({ text, checked: false })
        .select()
        .single();

      setAddDisabled(false);
      if (error) { showError('추가 실패: ' + error.message); return; }
      items.push(data);
      input.value = '';
      render();
      input.focus();
    }

    async function toggleItem(idx) {
      const item = items[idx];
      clearError();
      const { error } = await db
        .from('shopping_items')
        .update({ checked: !item.checked })
        .eq('id', item.id);

      if (error) { showError('업데이트 실패: ' + error.message); return; }
      items[idx].checked = !item.checked;
      render();
    }

    async function deleteItem(idx) {
      const item = items[idx];
      clearError();
      const { error } = await db
        .from('shopping_items')
        .delete()
        .eq('id', item.id);

      if (error) { showError('삭제 실패: ' + error.message); return; }
      items.splice(idx, 1);
      render();
    }

    async function clearDone() {
      const doneIds = items.filter(i => i.checked).map(i => i.id);
      if (doneIds.length === 0) return;

      clearError();
      const { error } = await db
        .from('shopping_items')
        .delete()
        .in('id', doneIds);

      if (error) { showError('삭제 실패: ' + error.message); return; }
      items = items.filter(i => !i.checked);
      render();
    }

    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      addItem();
    });

    document.getElementById('clearDoneBtn').addEventListener('click', clearDone);

    loadItems();
  </script>
</body>
</html>
